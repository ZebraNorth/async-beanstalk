name: Publish

on:
    release:
        types: [created]

permissions:
    # Required for publishing to NPM via OIDC
    id-token: write
    contents: read

jobs:
    publish-package:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '22'
                registry-url: 'https://registry.npmjs.org'
                package-manager-cache: false
            - run: npm ci
            - run: 'sed -i "s/\"version\": \"1.0.0\"/\"version\": \"${GITHUB_REF#refs/tags/v}\"/" package.json'
            - run: npm run docs
            - run: npm publish --access=public
